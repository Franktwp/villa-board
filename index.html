<script>
(function(){
  var URL_ = "https://script.google.com/macros/s/AKfycbzZkHbaPGsZXefvktKTEhmaT525WeSAXuN3beKEefLGMTh77tw06JOUqYyv1s_d4m82Zw/exec", KEY = "vb_pin";
  function getPin(){ try { return localStorage.getItem(KEY) || ""; } catch(e){ return ""; } }
  function setPin(p){ try { p ? localStorage.setItem(KEY, p) : localStorage.removeItem(KEY); } catch(e){} }
  async function call(tool, args){
    var write = tool !== "get_values", pin = "";
    if (write) {
      pin = getPin();
      if (!pin) { pin = (window.prompt("ใส่รหัส PIN สำหรับบันทึกการจอง") || "").trim(); if (!pin) throw { code:"no_pin" }; }
    }
    var r;
    try { r = await fetch(URL_, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ tool: tool, args: args, pin: pin }) }); }
    catch(e){ throw { code:"net" }; }
    var j; try { j = await r.json(); } catch(e){ throw { code:"net" }; }
    if (!j.ok) { if (j.code === "bad_pin") setPin(""); throw { code: j.code === "bad_pin" ? "bad_pin" : "tool_error", message: j.message || j.code }; }
    if (write) setPin(pin);
    return { payload: { values: j.values || [], range: args.range } };
  }
  var mcp = { callTool: function(server, tool, args){ return call(tool, args || {}); } };
  window.claude = { use: function(name){ return name === "mcp" ? Promise.resolve(mcp) : Promise.reject(new Error("not available")); } };
})();
</script>

<title>Villa Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky app bar (brand, module nav, refresh) over one working pane per route: Villa Management table, Villa Detail (header + tabs), Bookings list, Booking Calendar. Forms and confirms open as modals. */
:root{
  --bg:#F9FBFA; --surface:#FFFFFF; --surface-2:#F1F5F4; --line:#E3E9E7; --line-strong:#CDD7D4;
  --fg:#14211E; --muted:#5B6D68;
  --accent:#0E6B5A; --accent-fg:#FFFFFF; --accent-soft:#DCEFEA;
  --in:#13804B; --in-soft:#DDF3E6; --out:#B4600B; --out-soft:#FBEBD6; --stay:#2D5DA8; --stay-soft:#E1EAF8;
  --bad:#B42318; --bad-soft:#FBE3E0; --warn:#8A6100; --warn-soft:#FFF3CC;
  --st-active:#13804B; --st-active-bg:#DDF3E6; --st-inactive:#5E6966; --st-inactive-bg:#ECEFEE; --st-maint:#B4600B; --st-maint-bg:#FBEBD6;
  --p-airbnb:#C1343B; --p-airbnb-bg:#FDE7E8; --p-booking:#123E8C; --p-booking-bg:#E2EAF8; --p-agoda:#6B3FA0; --p-agoda-bg:#EEE6F8;
  --p-trip:#1C64D6; --p-trip-bg:#E2EEFE; --p-direct:#0E6B5A; --p-direct-bg:#DCEFEA; --p-other:#5E6966; --p-other-bg:#ECEFEE;
  --line-green:#06C755; --line-green-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(20,33,30,.05),0 4px 14px rgba(20,33,30,.05);
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
/* Light-only by design: the page keeps the same bright palette in every viewer theme. */
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
h1,h2,h3{text-wrap:balance}

/* app shell: left sidebar + content */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));z-index:20;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:9px;padding:0 6px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-fg);font-style:normal;font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{text-decoration:none;color:var(--muted);font-weight:500;padding:9px 10px;border-radius:8px;display:flex;align-items:center;gap:10px}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav a[aria-current="page"] svg{color:var(--accent)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
.sync{font-size:12.5px;color:var(--muted)}
/* phones & small tablets: compact top bar + bottom tab bar */
@media (max-width:900px){
  .app{display:block}
  .sidebar{height:auto;flex-direction:row;align-items:center;gap:10px;border-right:0;border-bottom:1px solid var(--line);padding-block:8px;padding-right:max(14px,env(safe-area-inset-right,0px))}
  .brand{font-size:16px;padding:0;white-space:nowrap}
  .sync{max-width:9em;line-height:1.25}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:35;flex-direction:row;gap:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(20,33,30,.06);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .nav a{flex:1 1 0;flex-direction:column;gap:3px;padding:6px 4px;font-size:11.5px;line-height:1.2;text-align:center;justify-content:center;min-height:52px}
  .nav a svg{width:22px;height:22px}
  .nav a[aria-current="page"]{background:var(--accent-soft)}
  .sidefoot{margin:0 0 0 auto;flex-direction:row;align-items:center;gap:8px;padding:0}
  .sync{font-size:11.5px}
  main .wrap{padding-block:14px calc(150px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;font-size:13.5px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.line{background:var(--line-green);color:var(--line-green-fg);border-color:var(--line-green);font-weight:600}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:32px;padding:0}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}
.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}
.inp,.sel{height:36px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 10px;font-size:13.5px;min-width:0}
.sel{padding-right:6px}
textarea.inp{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.45}
.search{position:relative;flex:1 1 300px;min-width:0}
.search input{width:100%;padding-left:36px}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--muted)}

/* page */
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.phead > div{margin-right:auto;min-width:0}
.phead h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.2px}
.phead p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer}
.stat:hover{border-color:var(--line-strong)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat span{font-size:12.5px;color:var(--muted);font-weight:500}
.stat b{font-size:26px;line-height:1.15}
.stat small{font-size:12px;color:var(--muted)}
.stat.g b{color:var(--st-active)} .stat.o b{color:var(--stay)} .stat.m b{color:var(--st-maint)}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{border-radius:10px;padding:11px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.err{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--warn-soft);color:var(--warn)}
.banner .btn{margin-left:auto}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-active{background:var(--st-active-bg);color:var(--st-active)}
.st-inactive{background:var(--st-inactive-bg);color:var(--st-inactive)}
.st-maintenance{background:var(--st-maint-bg);color:var(--st-maint)}
.pb{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pb.airbnb{background:var(--p-airbnb-bg);color:var(--p-airbnb)} .pb.booking{background:var(--p-booking-bg);color:var(--p-booking)}
.pb.agoda{background:var(--p-agoda-bg);color:var(--p-agoda)} .pb.trip{background:var(--p-trip-bg);color:var(--p-trip)}
.pb.direct{background:var(--p-direct-bg);color:var(--p-direct)} .pb.other{background:var(--p-other-bg);color:var(--p-other)}
.pbs{display:flex;gap:4px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.in{background:var(--in-soft);color:var(--in)} .pill.out{background:var(--out-soft);color:var(--out)} .pill.stay{background:var(--stay-soft);color:var(--stay)}
.pill.ok{background:var(--in-soft);color:var(--in)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}

/* table */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tscroll{overflow-x:auto}
table.vt{width:100%;border-collapse:collapse;min-width:1040px}
.vt th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.2px}
.vt th button{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.vt th button:hover{color:var(--fg)}
.vt th[aria-sort="ascending"] button,.vt th[aria-sort="descending"] button{color:var(--fg)}
.vt td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
.vt tr:last-child td{border-bottom:0}
.vt tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.vt .vn{font-weight:600;cursor:pointer;color:var(--fg);text-decoration:none;display:block;max-width:300px;overflow-wrap:anywhere}
.vt .vn:hover{color:var(--accent)}
.vt .sub{font-size:12px;color:var(--muted);max-width:300px;overflow-wrap:anywhere;display:block}
.vt .acts{display:flex;gap:2px;justify-content:flex-end}
.vt td.c{text-align:center}
.tfoot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tfoot .pg{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tfoot .pg button[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* detail */
.dhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.dhead .row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dhead h1{margin:0;font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.dhead .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.dhead .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin:0 -2px}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{margin:0;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel h3 .r{margin-left:auto}
.kv{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:8px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12.5px;font-weight:500;padding-top:1px}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.kv dd.na{color:var(--muted)}
@media (max-width:480px){.kv{grid-template-columns:minmax(0,1fr)}.kv dt{padding-top:6px}}
.contact{display:flex;flex-direction:column;gap:10px}
.contact .who{display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.contact .who b{display:block}
.contact .who span{font-size:12.5px;color:var(--muted)}
.qa{display:flex;gap:6px;flex-wrap:wrap}
.ltable{width:100%;border-collapse:collapse;min-width:640px}
.ltable th{font-size:12px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
.ltable td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;overflow-wrap:anywhere}
.ltable tr:last-child td{border-bottom:0}
.secret{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mask{letter-spacing:2px;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .it{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13px;flex-wrap:wrap}
.mini .it .d{min-width:132px}

/* booking list */
.bl{display:flex;flex-direction:column;gap:8px}
.bday{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.3px;margin-top:6px}
.ic{width:15px;height:15px;flex:none;vertical-align:-2px}
.bk .vn{display:block}
.bk .vn .ic{color:var(--accent);margin-right:5px;vertical-align:-2px}
.bk .meta .gi{display:inline-flex;align-items:center;gap:4px}
/* Check-in / Check-out / Staying sections for a date filter */
.secs{display:flex;gap:8px;flex-wrap:wrap}
.secs button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.secs button b{font-variant-numeric:tabular-nums}
.secs button.in{border-color:var(--in);color:var(--in)} .secs button.out{border-color:var(--out);color:var(--out)} .secs button.stay{border-color:var(--stay);color:var(--stay)}
.secs button:hover{background:var(--surface-2)}
.sech{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:600;scroll-margin-top:12px}
.sech .n{min-width:24px;height:22px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;font-size:12.5px}
.sech.in .n{background:var(--in-soft);color:var(--in)} .sech.out .n{background:var(--out-soft);color:var(--out)} .sech.stay .n{background:var(--stay-soft);color:var(--stay)}
.sech .sub{font-weight:400;font-size:12.5px;color:var(--muted)}
.secempty{font-size:13px;color:var(--muted);padding:2px 2px 4px}
/* floating Add booking button, on every page */
.fab{position:fixed;z-index:36;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));height:50px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 20px rgba(14,107,90,.35),0 2px 6px rgba(0,0,0,.12)}
.fab svg{width:20px;height:20px}
.fab:hover{filter:brightness(1.08)}
.fab:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 16px;align-items:start;font-size:13px}
.bk .dates{display:flex;flex-direction:column;gap:2px;font-size:12.5px;white-space:nowrap}
.bk .side{height:auto;position:static}
.bk .pill{height:20px;font-size:11.5px}
.bk .who a{font-size:14px}
.bk .amt{font-size:14px}
.bk .acts2{padding-top:6px;margin-top:2px}
.bk .acts2 .btn.sm{height:28px}
.bk .who{gap:2px}
.bk .acts2{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:8px;margin-top:4px;border-top:1px dashed var(--line)}
.bk .acts2 .sp{margin-left:auto}
.btn.ci{border-color:var(--in);color:var(--in)} .btn.ci:hover{background:var(--in-soft)}
.btn.co{border-color:var(--out);color:var(--out)} .btn.co:hover{background:var(--out-soft)}
.done{font-size:12px;font-weight:600}
.done.in{color:var(--in)} .done.out{color:var(--out)}
textarea.msg{width:100%;min-height:190px;font-family:var(--f-body);font-size:13.5px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:13px}
.bk .dates div{display:flex;gap:8px;align-items:center}
.bk .dates .pill{width:44px;justify-content:center;border-radius:6px;padding:0;flex:none}
.bk .booked{font-size:12px;color:var(--muted)}
.dfilter{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.dfilter label{font-size:12.5px;color:var(--muted);font-weight:500}
.dfilter .inp,.dfilter .sel{height:32px}

<script>
(() => {
"use strict";
/* ============================================================
   DATA MODEL (shared store; maps 1:1 to Supabase tables later)
   villas/{villa_id}            -> table villas (PK villa_id)
     villa_id, villa_name, internal_name, room_number, rooms, bedrooms, bathrooms,
     max_guests, address, maps_url, status ('active'|'inactive'|'maintenance'), notes,
     listings[]: {platform, property_name, listing_id, listing_url, status, notes}  -> table villa_listings (FK villa_id)
     owner:{name, phone, email, line_display, line_group, line_link, notes}       -> table villa_contacts (role='owner')
     housekeeper:{name, phone, line_display, line_group, line_link, team, notes}  -> table villa_contacts (role='housekeeper')
     ops:{checkin_time, checkout_time, cleaning_schedule, parking, guest_instructions, maintenance_notes}
     source:{sheet_row, key}, created_at, updated_at
   secure/{villa_id}            -> table villa_secure (RLS: admins only)
     access_instructions, key_notes, wifi, admin_notes
   booking_links/{booking_key}  -> bookings.villa_id (FK) for bookings whose sheet name is ambiguous
     villa_id, booking_id, platform, sheet_villa_name, linked_at
   Bookings are read from the Google Sheet "Reservation" tab and resolved to a villa_id;
   every relationship after that uses villa_id, never the name.
   ============================================================ */
const SHEET_ID = "14wKzPRBXoMwkn53cp3csjuzt3RyRTrD6EMp1zHybqIA";
const TABS = {
  villas: { gid: "289127522",  range: "'OTA Villa Matching'!A1:Z" },
  res:    { gid: "1808433811", range: "Reservation!A1:K" }
};
const PLATS = [
  { key:"airbnb", label:"Airbnb" }, { key:"booking", label:"Booking.com" }, { key:"agoda", label:"Agoda" },
  { key:"trip", label:"Trip.com" }, { key:"direct", label:"Direct" }, { key:"other", label:"Other" }
];
const PLAT_LABEL = Object.fromEntries(PLATS.map(p => [p.key, p.label]));
const STATUSES = [{ key:"active", label:"Active" }, { key:"inactive", label:"Inactive" }, { key:"maintenance", label:"Maintenance" }];
const ST_LABEL = Object.fromEntries(STATUSES.map(s => [s.key, s.label]));
const LINE_HOME = "https://line.me/R/";
const DAY = 86400000;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
const ls = {
  get(k){ try { return JSON.parse(localStorage.getItem("vb2:" + k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem("vb2:" + k, JSON.stringify(v)); } catch {} }
};

/* ---------- sheet → villa mapping (also used by the seed script) ---------- */
/*MAP-START*/
function platKey(p){
  const n = String(p ?? "").toLowerCase().replace(/[^a-z]/g, "");
  if (n.startsWith("airbnb")) return "airbnb";
  if (n.startsWith("booking")) return "booking";
  if (n.startsWith("agoda")) return "agoda";
  if (n.startsWith("trip")) return "trip";
  if (n.startsWith("direct")) return "direct";
  return n ? "other" : "";
}
function blankVilla(){
  return {
    villa_id:"", villa_name:"", internal_name:"", room_number:"", rooms:null, bedrooms:null, bathrooms:null,
    max_guests:null, address:"", maps_url:"", status:"active", notes:"", listings:[],
    owner:{ name:"", phone:"", email:"", line_display:"", line_group:"", line_link:"", notes:"" },
    housekeeper:{ name:"", phone:"", line_display:"", line_group:"", line_link:"", team:"", notes:"" },
    ops:{ checkin_time:"", checkout_time:"", cleaning_schedule:"", parking:"", guest_instructions:"", maintenance_notes:"" },
    source:{ sheet_row:null, key:"" }, created_at:"", updated_at:""
  };
}
function mapSheetRows(rows){
  const nz = s => String(s ?? "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
  const out = [], seen = new Set();
  // Find columns by their header text, so inserting or moving a column in the sheet doesn't shift the data.
  const hdr = ((rows && rows[0]) || []).map(nz);
  const col = (alts, fallback) => { for (const a of alts) { const i = hdr.indexOf(nz(a)); if (i >= 0) return i; } return hdr.length ? -1 : fallback; };
  const C = { group:col(["Linegroup","LINE group"], 0), owner:col(["Owner","เจ้าของ"], -1), airbnb:col(["Airbnb"], 1), booking:col(["Booking","Booking.com"], 2),
    trip:col(["Trip","Trip.com"], 3), agoda:col(["Agoda"], 4), note:col(["หมายเหตุ","Note","Notes"], 5), line:col(["LINE Link","Line link","LINE URL"], 6), short:col(["Short Name","ShortName","ชื่อย่อ"], 7) };
  // only a real web address counts as a LINE link (a note typed in the column must not become a link)
  const asLink = s => /^https?:\/\//i.test(s) ? s : /^line\.me\//i.test(s) ? "https://" + s : "";
  (rows || []).slice(1).forEach((r, i) => {
    const c = k => k < 0 ? "" : String((r && r[k]) ?? "").trim();
    const names = { airbnb:c(C.airbnb), booking:c(C.booking), trip:c(C.trip), agoda:c(C.agoda) };
    const group = c(C.group), note = c(C.note), line = asLink(c(C.line)), short = c(C.short), ownerName = c(C.owner);
    if (!names.airbnb && !names.booking && !names.trip && !names.agoda && !short) return;
    const key = [names.airbnb, names.booking, names.trip, names.agoda, short].map(nz).join("|");
    if (seen.has(key)) return; seen.add(key);
    const first = short || names.airbnb || names.agoda || names.booking || names.trip;
    const paren = ((names.airbnb || first).match(/\(([^()]+)\)\s*$/) || [])[1] || "";
    const brack = (first.match(/\[([^\]]+)\]/) || [])[1] || "";
    const all = Object.values(names).concat(short).join(" ");
    const v = blankVilla();
    v.villa_name = first.replace(/\s*\([^()]+\)\s*$/, "").trim() || first;
    const parenName = !short && paren.length > 6 && /\D{3,}/.test(paren);
    v.internal_name = short || (parenName ? paren.trim() : (paren && !nz(v.villa_name).includes(nz(paren)) ? first : v.villa_name));
    let room = "";
    if (paren && paren.length <= 6) room = paren.trim();
    else if (paren) room = (paren.match(/(\d{2,}[A-Za-z]?)\s*$/) || [])[1] || "";
    if (!room && brack) room = brack.trim();
    if (!room) room = (first.match(/^(\d+[A-Za-z])\s/) || [])[1] || "";
    v.room_number = room;
    const br = all.match(/(\d+)\s*(?:BR\b|BR\d|bedrooms?|bed\b|ห้องนอน)/i);
    const ba = all.match(/(\d+)\s*(?:BA\b|bathrooms?|ห้องน้ำ)/i);
    const pg = all.match(/for\s*(\d+)\s*persons?/i);
    v.bedrooms = br ? +br[1] : null; v.rooms = v.bedrooms; v.bathrooms = ba ? +ba[1] : null;
    v.max_guests = pg ? +pg[1] : null;
    v.notes = note;
    v.owner.line_group = group; v.owner.line_link = line; v.owner.name = ownerName;
    [["airbnb","Airbnb"],["booking","Booking.com"],["agoda","Agoda"],["trip","Trip.com"]].forEach(([k, label]) => {
      if (names[k]) v.listings.push({ platform:label, property_name:names[k], listing_id:"", listing_url:"", status:"Listed", notes:"" });
    });
    v.source = { sheet_row: i + 2, key, keys: [key] };
    // Same unit listed twice (e.g. two Airbnb listings for "Nana317"): merge into one villa.
    const twin = parenName && out.find(o => nz(o.internal_name) === nz(v.internal_name));
    if (twin) {
      v.listings.forEach(l => { if (!twin.listings.some(x => x.platform === l.platform && nz(x.property_name) === nz(l.property_name))) twin.listings.push(l); });
      twin.source.keys.push(key);
      if (!twin.notes && v.notes) twin.notes = v.notes;
      return;
    }
    out.push(v);
  });
  return out;
}
/*MAP-END*/

/* ---------- state ---------- */
const S = {
  route: { name:"villas", id:null },
  villas: [], vmap: new Map(), villasReady: false, dbState: "loading", // loading | ok | none
  secure: {}, links: {}, stay: {}, res: [], resReady: false, sheetVillaRows: null,
  loadedAt: null, source: "", loading: false,
  can: { write: false, admin: false, known: false },
  // villa list
  vq: "", vStatus: "", vPlat: "", vRooms: "", vOwner: "", vHk: "", sort: ls.get("sort") || { k:"villa_id", d:1 }, page: 1, size: ls.get("size") || 20,
  // detail
  tab: "overview", reveal: false, histMode: "list", hCal: null, hSel: null,
  // bookings
  bq: "", bPlat: "", bStatus: "", rng: ls.get("rng") === "custom" ? "upcoming" : (ls.get("rng") || "upcoming"), bDateBy: "stay", bFrom: "", bTo: "", calMonth: startOfMonth(today()), selDay: null,
  mounted: ""
};
let db = null, user = null, mcpP = null;

/* ---------- dates ---------- */
function today(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function sameDay(a,b){ return !!a && !!b && a.getTime() === b.getTime(); }
function parseDate(v){
  if (!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);

function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}
async function viaCSV(tab){
  const r = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${tab.gid}&t=${Date.now()}`, { cache:"no-store" });
  if (!r.ok) throw { code:"http", message:"HTTP " + r.status };
  const t = await r.text();
  if (/^\s*<!doctype html/i.test(t)) throw { code:"private", message:"" };
  return parseCSV(t);
}

/* ---------- shared copy of the sheet (for viewers without the Google Sheets connector) ----------

    await db.doc("sheet_cache/villas").set({ gen, data: JSON.stringify(vRows) });
    for (let i = 0; i < parts; i++) await db.doc("sheet_cache/res-" + i).set({ gen, part: i, data: JSON.stringify(rRows.slice(i * CACHE_PART, (i + 1) * CACHE_PART)) });
    await db.doc("sheet_cache/meta").set({ gen, res_parts: parts, rows: Math.max(0, rRows.length - 1), updated_at: new Date().toISOString() });

  const C = { plat:col(["Platform"],0), villa:col(["Villa"],1), bdate:col(["Booking Date"],2), cin:col(["Check-in"],3), cout:col(["Check-out"],4),
    amt:col(["Amount"],5), guest:col(["Guest Name"],6), guests:col(["Guests"],7), bid:col(["Booking ID"],8), st:col(["Status"],9), note:col(["Note"],10) };

function parseRoute(){
  const h = location.hash.replace(/^#/, "");
  const m = h.match(/^villa-([A-Za-z0-9_-]+)$/);
  if (m) return { name:"villa", id:m[1] };
  if (h === "bookings" || h === "calendar") return { name:h, id:null };
  return { name:"villas", id:null };
}
function go(hash){ if (location.hash === "#" + hash) onRoute(); else location.hash = hash; }
function onRoute(){
  const r = parseRoute();
  if (r.name === "villa" && (S.route.name !== "villa" || S.route.id !== r.id)) { S.tab = "overview"; S.reveal = false; S.histMode = "list"; S.hCal = null; S.hSel = null; }
  S.route = r; S.mounted = "";
  closeModal();
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", onRoute);

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("[data-nav]").forEach(a => {
    const on = a.dataset.nav === S.route.name || (S.route.name === "villa" && a.dataset.nav === "villas");
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  renderPage();
}
function renderPage(){
  const r = S.route;
  if (r.name === "villas") renderVillaList();
  else if (r.name === "villa") renderDetail(r.id);
  else if (r.name === "bookings") renderBookings();
  else renderCalendarPage();
}

/* ===== Villa Management list ===== */
function villaHay(v){
  if (v._hayFor === v.updated_at && v._hay) return v._hay;
  const parts = [v.villa_id, v.villa_name, v.internal_name, v.room_number, v.owner && v.owner.name, v.owner && v.owner.line_group,
    v.housekeeper && v.housekeeper.name, v.housekeeper && v.housekeeper.team, ...(v.listings || []).map(l => l.property_name + " " + l.listing_id)];
  const h = norm(parts.join(" "));
  try { Object.defineProperty(v, "_hay", { value:h, writable:true, configurable:true }); Object.defineProperty(v, "_hayFor", { value:v.updated_at, writable:true, configurable:true }); } catch {}
  return h;
}
function filteredVillas(){
  const terms = S.vq.trim().split(/\s+/).map(norm).filter(Boolean);
  let list = S.villas.filter(v => {
    if (S.vStatus === "occupied") { if (!occupied(v.villa_id)) return false; }
    else if (S.vStatus && v.status !== S.vStatus) return false;
    if (S.vPlat && !villaPlats(v).includes(S.vPlat)) return false;
    if (S.vRooms) { const n = v.rooms || 0; if (S.vRooms === "none" ? n : S.vRooms === "4" ? n < 4 : n !== +S.vRooms) return false; }
    if (S.vOwner && (v.owner && v.owner.name) !== S.vOwner) return false;
    if (S.vHk && (v.housekeeper && v.housekeeper.name) !== S.vHk) return false;
    if (terms.length) { const h = villaHay(v); if (!terms.every(t => h.includes(t))) return false; }
    return true;
  });
  const { k, d } = S.sort;
  const val = v => k === "villa_name" ? vName(v).toLowerCase() : String(v[k] ?? "");
  list.sort((a,b) => {
    const A = val(a), B = val(b);
    if (!A && B) return 1; if (A && !B) return -1;
    return A.localeCompare(B, "en", { numeric:true }) * d;
  });
  return list;
}

      <div class="pg">${pager(pages)}</div>
    </div></div>`;
  $("#psize").addEventListener("change", e => { S.size = +e.target.value; S.page = 1; ls.set("size", S.size); drawVillaTable(); });

function pager(pages){
  if (pages <= 1) return "";
  const p = S.page, set = new Set([1, pages, p - 1, p, p + 1].filter(n => n >= 1 && n <= pages));
  const nums = [...set].sort((a,b) => a - b);
  let out = `<button class="btn sm" type="button" data-page="${p - 1}" ${p === 1 ? "disabled" : ""} aria-label="Previous page">‹</button>`, last = 0;
  nums.forEach(n => { if (n - last > 1) out += `<span class="muted">…</span>`; out += `<button class="btn sm" type="button" data-page="${n}" ${n === p ? 'aria-current="page"' : ""}>${n}</button>`; last = n; });
  return out + `<button class="btn sm" type="button" data-page="${p + 1}" ${p === pages ? "disabled" : ""} aria-label="Next page">›</button>`;
}

function renderBookingList(el, list, opt = {}){
  if (!S.resReady) { el.innerHTML = `<div class="empty">Loading bookings…</div>`; return; }
  if (!list.length) { el.innerHTML = `<div class="empty">No bookings in this view.${!opt.inVilla && S.rng !== "all" ? `<button class="btn sm" type="button" data-act="rngAll">Show all bookings</button>` : ""}</div>`; return; }
  if (opt.inVilla) { el.innerHTML = `<div class="bl">${list.map(b => bookingRow(b, null, opt)).join("")}</div>`; return; }
  const w = dateWindow();
  if (w && w.kinds) { el.innerHTML = moveSections(list, w.from, w.to, w.kinds, { scope:"b" }); return; }
  const byBooked = w && w.booked;
  const key = b => byBooked ? b.bookedAt : b.cin;
  const rows = byBooked ? list.slice().sort((a, z) => (key(a) || 0) - (key(z) || 0) || (a.cin || 0) - (z.cin || 0)) : list;
  const groups = new Map();
  rows.forEach(b => { const d = key(b), k = d ? d.getTime() : 0; if (!groups.has(k)) groups.set(k, { d, items:[] }); groups.get(k).items.push(b); });
  el.innerHTML = `<div class="bl">${[...groups.values()].map(g => `<div class="bday">${byBooked ? "Reserved" : "Check-in"} ${g.d ? esc(fmtDY(g.d)) : "— no date"}${sameDay(g.d, today()) ? " · Today" : ""}</div>${g.items.map(b => bookingRow(b)).join("")}`).join("")}</div>`;
}
// The dates the current Booking filter covers. kinds = which sections to show (null: list by check-in date as before).
function dateWindow(){
  const t = today(), all = ["in","out","stay"];
  if (S.rng === "today") return { from:t, to:t, kinds:all };
  if (S.rng === "7d") return { from:t, to:addDays(t, 7), kinds:all };
  if (S.rng === "month") return { from:startOfMonth(t), to:new Date(t.getFullYear(), t.getMonth() + 1, 0), kinds:all };
  if (S.rng === "custom" && (S.bFrom || S.bTo)) {
    const from = S.bFrom ? parseDate(S.bFrom) : null, to = S.bTo ? parseDate(S.bTo) : null;
    if (S.bDateBy === "booked") return { from, to, booked:true };
    return { from, to, kinds: S.bDateBy === "cin" ? ["in"] : S.bDateBy === "cout" ? ["out"] : all };
  }
  return null;
}
// Bookings split into Check-in → Check-out → Staying for a date or a date range, each with its count.
// Staying = in the villa the whole time (checked in before, leaves after). A booking that checks in and out inside the range is listed under both.
function moveSections(list, from, to, kinds, opt = {}){
  const inR = d => !!d && (!from || d >= from) && (!to || d <= to);
  const oneDay = from && to && sameDay(from, to);
  const byName = (a, z) => { const n = b => { const v = b.villaId && S.vmap.get(b.villaId); return v ? vName(v) : (b.sheetVilla || ""); }; return n(a).localeCompare(n(z)); };
  const sec = {
    in:   list.filter(b => inR(b.cin)).sort((a, z) => a.cin - z.cin || byName(a, z)),
    out:  list.filter(b => b.cout && inR(b.cout)).sort((a, z) => a.cout - z.cout || byName(a, z)),
    stay: from && to ? list.filter(b => b.cin && b.cout && b.cin < from && b.cout > to).sort((a, z) => a.cout - z.cout || byName(a, z)) : []
  };
  const meta = {
    in:   { pill:`<span class="pill in">IN</span>`,  label:"Check-in",  tag:`<span class="pill in">Check-in</span>`, when:b => b.cin, none:"ไม่มีเช็คอิน · NO Have" },
    out:  { pill:`<span class="pill out">OUT</span>`, label:"Check-out", tag:`<span class="pill out">Check-out</span>`, when:b => b.cout, none:"ไม่มีเช็คเอาท์ · NO Have" },
    stay: { pill:`<span class="pill stay">STAY</span>`, label:"Staying", tag:`<span class="pill stay">Staying</span>`, when:null, none:"ไม่มีแขกพักต่อ · NO Have" }
  };
  const span = oneDay ? fmtDY(from) : `${from ? fmtD(from) : "…"} – ${to ? fmtD(to) : "…"}`;
  const id = k => `sec-${opt.scope || "b"}-${k}`;
  const chips = `<div class="secs">${kinds.map(k => `<button class="${k}" type="button" data-jump="${id(k)}">${meta[k].label} <b>${sec[k].length}</b></button>`).join("")}</div>`;
  const body = kinds.map(k => {
    const m = meta[k], items = sec[k];
    let rows = "";
    if (!items.length) rows = `<div class="secempty">${m.none}</div>`;
    else if (oneDay || !m.when) rows = items.map(b => bookingRow(b, null, { ...opt, tag:m.tag })).join("");
    else {
      let last = null;
      rows = items.map(b => { const d = m.when(b), h = !sameDay(d, last) ? `<div class="bday">${esc(fmtDY(d))}${sameDay(d, today()) ? " · Today" : ""}</div>` : ""; last = d; return h + bookingRow(b, null, { ...opt, tag:m.tag }); }).join("");
    }
    return `<div class="sech ${k}" id="${id(k)}">${m.pill} ${m.label} <span class="n num">${items.length}</span><span class="sub">${esc(span)}</span></div>${rows}`;
  }).join("");
  return `<div class="bl">${kinds.length > 1 ? chips : ""}${body}</div>`;
}
function bookingPass(b, ignoreRange){
  if (S.bPlat && b.pkey !== S.bPlat) return false;
  if (S.bStatus === "unlinked") { if (b.villaId) return false; }
  else if (S.bStatus && b.status !== S.bStatus) return false;
  const terms = S.bq.trim().split(/\s+/).map(norm).filter(Boolean);
  if (terms.length) {
    const v = b.villaId && S.vmap.get(b.villaId);
    const h = norm([b.sheetVilla, b.guest, b.bid, b.platform, b.note, v ? villaHay(v) : ""].join(" "));
    if (!terms.every(t => h.includes(t))) return false;
  }
  if (ignoreRange || S.rng === "all") return true;
  if (S.rng === "custom") {
    const from = S.bFrom ? parseDate(S.bFrom) : null, to = S.bTo ? parseDate(S.bTo) : null;
    if (!from && !to) return true;
    const inR = d => !!d && (!from || d >= from) && (!to || d <= to);
    if (S.bDateBy === "cin") return inR(b.cin);
    if (S.bDateBy === "cout") return inR(b.cout);
    if (S.bDateBy === "booked") return inR(b.bookedAt);
    if (!b.cin) return false;
    const out = b.cout || b.cin;
    return (!to || b.cin <= to) && (!from || out >= from);
  }
  const t = today(); if (!b.cin) return false;
  const out = b.cout || addDays(b.cin, 1);
  if (S.rng === "upcoming") return out >= t;
  if (S.rng === "today") return b.cin <= t && out >= t;
  if (S.rng === "7d") return b.cin <= addDays(t, 7) && out >= t;
  if (S.rng === "month") return b.cin < new Date(t.getFullYear(), t.getMonth() + 1, 1) && out >= startOfMonth(t);
  return true;
}

function drawCalendar(){ const w = $("#cwrap"); if (w) renderCal(w, S.res.filter(b => bookingPass(b, true)), { month:S.calMonth, sel:S.selDay, scope:"main" }); }
const BAR_PLAT = { airbnb:"Airbnb", booking:"Booking", agoda:"Agoda", trip:"Trip", direct:"Direct", other:"Other" };
function renderCal(el, list, o){
  if (!S.resReady) { el.innerHTML = `<div class="empty">Loading bookings…</div>`; return; }
  const m = o.month, t = today(), first = new Date(m.getFullYear(), m.getMonth(), 1), start = addDays(first, -first.getDay());
  const live = list.filter(b => b.cin);
  const label = b => { const v = b.villaId && S.vmap.get(b.villaId); return o.inVilla ? (b.guest || b.platform) : (v ? vName(v) : b.sheetVilla); };
  let weeks = "";
  for (let w = 0; w < 6; w++) {
    const ws = addDays(start, w * 7), we = addDays(ws, 6);
    if (w >= 4 && ws.getMonth() !== m.getMonth() && ws > first) break;
    // stay bars: check-in day through check-out day, split per week
    const segs = live.filter(b => b.cin <= we && (b.cout || b.cin) >= ws)
      .map(b => { const end = b.cout || b.cin, s = b.cin < ws ? ws : b.cin, e = end > we ? we : end;
        return { b, c1: Math.round((s - ws) / DAY) + 1, c2: Math.round((e - ws) / DAY) + 2, starts: b.cin >= ws, ends: end <= we }; })
      .sort((a, z) => a.c1 - z.c1 || (z.c2 - z.c1) - (a.c2 - a.c1));
    const lanes = [];
    segs.forEach(sg => { let l = lanes.findIndex(endCol => endCol <= sg.c1); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = sg.c2; sg.lane = l; });
    const rowsN = lanes.length + 2;
    let cells = "";
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i);
      const occ = live.filter(b => !isCancelled(b) && b.cout && b.cin <= d && d < b.cout).length;
      cells += `<div class="cell ${d.getMonth() !== m.getMonth() ? "other" : ""} ${sameDay(d, t) ? "today" : ""} ${sameDay(d, o.sel) ? "sel" : ""}" style="grid-column:${i + 1};grid-row:1 / span ${rowsN}" data-day="${d.getTime()}" data-scope="${o.scope}" role="button" tabindex="0" aria-label="${esc(fmtDY(d))}">
        <span class="d num"><span>${d.getDate()}</span>${occ ? `<span class="occ" title="Villas occupied this night">${occ}</span>` : ""}</span></div>`;
    }
    const bars = segs.map(sg => {
      const b = sg.b, v = b.villaId && S.vmap.get(b.villaId);
      // bar text: Villa / booking channel (e.g. "ForFam / Booking")
      const ch = BAR_PLAT[b.pkey] || b.platform || "";
      const txt = o.inVilla ? `${b.guest || "Guest"}${ch ? " / " + ch : ""}` : `${label(b) || "Not linked"}${ch ? " / " + ch : ""}`;
      const tip = `${label(b)} / ${b.platform || "—"} — ${b.guest || "Guest"} · ${fmtD(b.cin)} → ${fmtD(b.cout)}${b.status ? " · " + b.status : ""}`;
      const cls = `bar ${sg.starts ? "s" : ""} ${sg.ends ? "e" : ""} ${isCancelled(b) ? "x" : ""} ${v ? "" : "unl"}`;

function readForm(){

  });
  out.listings = [...document.querySelectorAll("#lrows [data-lrow]")].map(r => {

    return { platform:g("platform"), property_name:g("property_name"), listing_id:g("listing_id"), listing_url:g("listing_url"), status:g("status"), notes:g("notes") };

function validate(d, editing){
  const errs = {};
  const need = editing ? ["villa_name", "status"] : ["villa_id", "villa_name", "room_number", "rooms", "max_guests", "status"];
  need.forEach(k => { if (d[k] === "" || d[k] == null) errs[k] = "Required"; });
  if (!editing && d.villa_id) {
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(d.villa_id)) errs.villa_id = "Use letters, numbers, - or _ only";
    else if ([...S.vmap.keys()].some(k => k.toLowerCase() === d.villa_id.toLowerCase())) errs.villa_id = `${d.villa_id} is already used by ${vName(S.vmap.get([...S.vmap.keys()].find(k => k.toLowerCase() === d.villa_id.toLowerCase())))}`;
  }
  ["rooms", "max_guests", "bedrooms", "bathrooms"].forEach(k => { if (d[k] != null && (!Number.isFinite(d[k]) || d[k] < 0)) errs[k] = "Enter a number of 0 or more"; });
  if (d.max_guests === 0) errs.max_guests = "At least 1 guest";
  const urls = [["maps_url", d.maps_url], ["owner.line_link", d.owner.line_link], ["housekeeper.line_link", d.housekeeper.line_link]];
  urls.forEach(([k, u]) => { if (u && !/^https?:\/\//i.test(u)) errs[k] = "Start the link with https://"; });
  if (d.owner.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.owner.email)) errs["owner.email"] = "Enter a valid email";
  document.querySelectorAll("#vform [data-wrap]").forEach(w => {
    const e = errs[w.dataset.wrap], s = w.querySelector(".err");
    w.classList.toggle("invalid", !!e); s.hidden = !e; s.textContent = e || "";
  });
  return errs;
}

async function saveVilla(editId, more){
  if (saving) return;

  const errs = validate(d, editing);

    const f = document.querySelector("#vform .invalid .inp"); if (f) { f.focus(); f.scrollIntoView({ block:"center" }); }
    return;
  }
  const id = editing ? editId : d.villa_id;
  const prev = editing ? S.vmap.get(id) : null;
  const now = new Date().toISOString();
  const doc = { ...blankVilla(), ...(prev ? JSON.parse(JSON.stringify(prev)) : {}),
    villa_id:id, villa_name:d.villa_name, internal_name:d.internal_name || d.villa_name, room_number:d.room_number,
    rooms:d.rooms, bedrooms:d.bedrooms, bathrooms:d.bathrooms, max_guests:d.max_guests, address:d.address, maps_url:d.maps_url,
    status:d.status, notes:d.notes, listings:d.listings, owner:d.owner, housekeeper:d.housekeeper, ops:d.ops,
    updated_at:now, created_at:(prev && prev.created_at) || now };
  if (!prev) doc.source = { sheet_row:null, key:"" };
  const fe = $("#formErr"); fe.hidden = true;
  saving = true; document.querySelectorAll('[data-act="save"]').forEach(b => b.disabled = true);
  try {
    if (!db) throw { code:"none", message:"the shared database isn't available on this page" };
    await db.doc("villas/" + id).set(doc);
    if (S.can.admin && document.querySelector('#vform [data-f^="sec."]')) {
      const s = d.sec, had = S.secure[id] || {};
      if (JSON.stringify(s) !== JSON.stringify({ access_instructions:had.access_instructions || "", key_notes:had.key_notes || "", wifi:had.wifi || "", admin_notes:had.admin_notes || "" })) {
        await db.doc("secure/" + id).set({ ...s, updated_at:now }); S.secure[id] = { ...s };
      }
    }
    // reflect immediately; the live snapshot confirms
    const list = S.villas.filter(v => v.villa_id !== id).concat([doc]); setVillas(list);
    toast(editing ? `Saved ${vName(doc)}` : `Added ${vName(doc)} (${id})`);
    if (more) { saving = false; closeModal(); render(); openForm(null); return; }
    closeModal();
    if (!editing) go("villa-" + id); else render();
  } catch (e) {
    fe.textContent = writeErr(e); fe.hidden = false; fe.scrollIntoView({ block:"center" });
  } finally {
    saving = false; document.querySelectorAll('[data-act="save"]').forEach(b => b.disabled = false);
  }
}

// Confirm the booking is still on the row we loaded it from (rows can shift when people edit the sheet).
async function findSheetRow(mcp, eb){
  const same = r => r && (eb.bid ? String(r[8] ?? "").trim() === String(eb.bid) : (String(r[6] ?? "").trim() === eb.guest && parseDate(r[3]) && sameDay(parseDate(r[3]), eb.cin)));
  const one = await mcp.callTool("Google Sheets", "get_values", { spreadsheetId: SHEET_ID, range: `Reservation!A${eb.row}:K${eb.row}` }, { cache: false });
  const v1 = one && one.payload && (one.payload.values || (one.payload.content && one.payload.content.values));
  if (Array.isArray(v1) && same(v1[0])) return eb.row;
  const all = await mcp.callTool("Google Sheets", "get_values", { spreadsheetId: SHEET_ID, range: TABS.res.range }, { cache: false });
  const rows = (all && all.payload && (all.payload.values || (all.payload.content && all.payload.content.values))) || [];
  const hits = rows.map((r, i) => same(r) && i > 0 ? i + 1 : 0).filter(Boolean);
  if (hits.length === 1) return hits[0];
  throw { code:"moved" };
}

/* Daily notice in the team's LINE format:
   📅 Check-in / Check-out 19.11.26
   🟢 IN 19 Nov 2026          (each booking: platform line, 🏠villa [> ส่งอินแล้ว], 19Nov - 22Nov)
   ———
   🔴 OUT 19 Nov 2026         (> ส่งเอาท์แล้ว when marked)
   An empty section reads "NO Have". Cancelled bookings are left out. */
const PLAT_LINE = { airbnb:"🆎 Air bnb", trip:"💙 Trips", booking:"🔵 Booking", agoda:"🟣 Agoda", direct:"⭐ Direct", other:"▫️ Other" };
const SEP_LINE = "—————————————————————";
const dShort = d => d ? d.getDate() + d.toLocaleDateString("en-GB", { month:"short" }) : "-";
const dLong = d => d.toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
const dDots = d => [d.getDate(), d.getMonth() + 1, d.getFullYear() % 100].map(n => String(n).padStart(2, "0")).join(".");
function dayMoves(d, onlyKey){
  const live = S.res.filter(b => !isCancelled(b) && b.cin && (!onlyKey || b.key === onlyKey));
  const name = b => { const v = b.villaId && S.vmap.get(b.villaId); return v ? vName(v) : b.sheetVilla; };
  const order = (a, z) => (a.pkey || "").localeCompare(z.pkey || "") || name(a).localeCompare(name(z));
  return { ins: live.filter(b => sameDay(b.cin, d)).sort(order), outs: live.filter(b => b.cout && sameDay(b.cout, d)).sort(order), name };
}
function dayNoticeText(d, onlyKey){
  const { ins, outs, name } = dayMoves(d, onlyKey);
  const block = (b, kind) => {
    const st = S.stay[b.key] || {};
    const sent = kind === "in" ? (st.checked_in_at ? " > ส่งอินแล้ว" : "") : (st.checked_out_at ? " > ส่งเอาท์แล้ว" : "");
    return [PLAT_LINE[b.pkey] || ("▫️ " + (b.platform || "Other")), "🏠" + name(b) + sent, `${dShort(b.cin)} - ${dShort(b.cout)}`].join("\n");
  };
  return [
    `📅 Check-in / Check-out ${dDots(d)}`,
    `🟢 IN ${dLong(d)}`, "",
    ins.length ? ins.map(b => block(b, "in")).join("\n\n") : "NO Have", "",
    SEP_LINE,
    `🔴 OUT ${dLong(d)}`, "",
    outs.length ? outs.map(b => block(b, "out")).join("\n\n") : "NO Have"
  ].join("\n");
}

  if (ds.bedit) { openBookingForm(ds.bedit); return; }
  if (ds.pick) { saveLink(ds.key, ds.pick); return; }
  if (ds.rng) { S.rng = ds.rng; S.bFrom = S.bTo = ""; ls.set("rng", S.rng); if ($("#rng")) { $("#rng").value = S.rng; $("#bFrom").value = ""; $("#bTo").value = ""; } drawBookings(); return; }
  if (ds.unl) { S.bStatus = S.bStatus === "unlinked" ? "" : "unlinked"; S.rng = "all"; $("#bStatus").value = S.bStatus; $("#rng").value = "all"; drawBookings(); return; }
  if (ds.cal !== undefined) {
    const n = +ds.cal, key = ds.scope === "hist" ? "hCal" : "calMonth", sel = ds.scope === "hist" ? "hSel" : "selDay";
    const cur = S[key] || startOfMonth(today());
    S[key] = n === 0 ? startOfMonth(today()) : new Date(cur.getFullYear(), cur.getMonth() + n, 1);
    if (n === 0) S[sel] = today();
    ds.scope === "hist" ? renderPage() : drawCalendar(); return;
  }
  if (ds.day) {
    const d = new Date(+ds.day), sel = ds.scope === "hist" ? "hSel" : "selDay";
    S[sel] = sameDay(S[sel], d) ? null : d;
    ds.scope === "hist" ? renderPage() : drawCalendar();
    // bring the day's list into view (it sits under the month grid, often off-screen on phones)
    if (S[sel]) setTimeout(() => { const p = document.getElementById("cpanel-" + (ds.scope || "main")); if (p) p.scrollIntoView({ block:"start", behavior:"smooth" }); }, 30);
    return;
  }
  switch (ds.act) {
    case "retry": loadSheet(true); break;
    case "add": openForm(null); break;
    case "badd": openBookingForm(null); break;
    case "ntoday": openDayNotice(today()); break;
    case "ftoggle": { const tb = t.closest(".toolbar"); const open = tb.classList.toggle("open"); t.setAttribute("aria-expanded", String(open)); break; }
    case "bsave": saveBooking(); break;
    case "ncopy": copyText($("#nmsg").value, "Message copied"); break;
    case "nday": { const n = +ds.delta; openDayNotice(n === 0 ? today() : addDays(S._nDay || today(), n), S._nKey, S._nKind); break; }
    case "nmark": markStay(ds.key, ds.kind, !!ds.undo); break;
    case "sync": syncFromSheet(); break;
    case "dosync": doSync(); break;
    case "mclose": closeModal(); break;
    case "save": saveVilla(ds.id || null, !!ds.more); break;
    case "dodel": doDelete(ds.id); break;
    case "unlink": saveLink(ds.key, null); break;
    case "ladd": { const w = document.createElement("div"); w.innerHTML = listingRow({ platform:"Airbnb", property_name:"", listing_id:"", listing_url:"", status:"Listed", notes:"" }); const row = w.firstElementChild; $("#lrows").appendChild(row); row.querySelector('[data-l="property_name"]').focus(); break; }
    case "lrm": t.closest("[data-lrow]").remove(); break;
    case "reveal": S.reveal = !S.reveal; renderPage(); break;
    case "rngAll": S.rng = "all"; S.bFrom = S.bTo = ""; ls.set("rng", "all"); if ($("#rng")) { $("#rng").value = "all"; $("#bFrom").value = ""; $("#bTo").value = ""; } drawBookings(); break;
    case "dsearch": applyDates(true); break;
    case "dclear": S.bFrom = S.bTo = ""; $("#bFrom").value = ""; $("#bTo").value = ""; if (S.rng === "custom") { S.rng = "all"; $("#rng").value = "all"; } drawBookings(); break;
    case "vreset":
      S.vq = ""; S.vStatus = S.vPlat = S.vRooms = S.vOwner = S.vHk = ""; S.page = 1;
      ["vq","vStatus","vPlat","vRooms","vOwner","vHk"].forEach(id => { const el = $("#" + id); if (el) el.value = ""; });
      drawVillaTable(); break;
  }
});

/* ---------- boot ---------- */
S.route = parseRoute();
render();
initStore();
loadSheet(false);
})();
</script>

</body></html>
